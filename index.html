<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure Creator — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: #0f0f1a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-nuova {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-nuova:hover { background: #6d28d9; transform: translateY(-1px); }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 40px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
    }
    .empty-illustration {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 28px;
      white-space: pre;
    }
    .empty-state h2 {
      font-size: 24px;
      color: #e5e7eb;
      margin-bottom: 10px;
    }
    .empty-state p {
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 16px;
    }
    .btn-esempio {
      background: transparent;
      color: #a78bfa;
      border: 2px solid #7c3aed;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-esempio:hover { background: #7c3aed; color: #fff; }

    /* ── Grid ── */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1c1c2e;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color .2s, transform .15s;
    }
    .card:hover { border-color: rgba(124,58,237,.4); transform: translateY(-2px); }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #f9fafb;
    }
    .card-meta {
      font-size: 13px;
      color: #6b7280;
    }
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .btn-apri {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-apri:hover { background: #6d28d9; }

    .btn-elimina {
      background: transparent;
      color: #ef4444;
      border: 1px solid rgba(239,68,68,.3);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-elimina:hover { background: rgba(239,68,68,.15); }

    /* ── Card esempio ── */
    .card-esempio {
      background: rgba(124,58,237,.08);
      border: 1px dashed rgba(124,58,237,.4);
    }
    .card-esempio .card-title { color: #a78bfa; }
    .card-esempio .card-meta { color: #7c3aed; opacity: .8; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #374151;
      border-top: 1px solid rgba(255,255,255,.04);
    }
  </style>
</head>
<body>

  <header>
    <h1>Adventure Creator</h1>
    <button class="btn-nuova" onclick="nuovaAvventura()">&#xFF0B; Nuova avventura</button>
  </header>

  <main>
    <div id="dashboard"></div>
  </main>

  <footer>Adventure Creator — nessuna dipendenza, tutto nel browser</footer>

  <script>
    // ── Avventura esempio ──────────────────────────────────────

gi":[],"azioni":["addestrati_senza_spada","addestrati_con_spada","indossa_armatura_cortile"]},"cappella":{"id":"cappella","nome":"Cappella del Castello","descrizione":"La cappella è silenziosa e solenne. Candele illuminano l'altare. Don Rodrigo è qui, in piena armatura, con la sua spada sguainata. Vi guarda negli occhi.\n\n'Siete pronti a ricevere l'investitura cavalleresca?'","descrizione_ritorno":"Siete nella cappella. Il momento della cerimonia si avvicina.","uscite":{"nord":null,"sud":"cortile_torneo","est":null,"ovest":null},"uscite_condizionali":[],"oggetti":[],"personaggi":["castellano"],"azioni":["chiedi_investitura_senza_requisiti","chiedi_investitura_completa"]}},"oggetti":{"spada_legno":{"id":"spada_legno","nome":"Spada di legno","sinonimi":["spada","legno","arma"],"descrizione":"Una spada di legno consumata dall'uso, ideale per l'addestramento. I migliori cavalieri hanno iniziato così.","raccoglibile":true,"visibile":true},"scudo":{"id":"scudo","nome":"Scudo con stemma","sinonimi":["scudo","stemma","difesa"],"descrizione":"Uno scudo rotondo con lo stemma del castello: un'aquila dorata su campo azzurro. Ogni cavaliere deve conoscere l'araldica.","raccoglibile":true,"visibile":true},"codice_cavalleria":{"id":"codice_cavalleria","nome":"Codice della Cavalleria","sinonimi":["codice","libro","pergamena","manoscritto"],"descrizione":"Il Codice della Cavalleria elenca i valori fondamentali: Lealtà al signore, Protezione dei deboli, Coraggio in battaglia, Fede, Onore sopra ogni cosa. Ogni cavaliere deve conoscerlo a memoria.","raccoglibile":true,"visibile":true},"armatura":{"id":"armatura","nome":"Armatura da cavaliere","sinonimi":["armatura","corazza","elmo"],"descrizione":"Un'armatura completa in ferro lucidato. Pesa molto ma protegge in battaglia. È il simbolo del cavaliere.","raccoglibile":true,"visibile":false}},"personaggi":{"maestro_aldric":{"id":"maestro_aldric","nome":"Maestro Aldric","sinonimi":["aldric","maestro","cavaliere","anziano"],"descrizione":"     // ── localStorage helpers ───────────────────────────────────
    function caricaIndex() {
      try { return JSON.parse(localStorage.getItem('adventures_index') || '[]'); }
      catch(e) { return []; }
    }

    function salvaIndex(arr) {
      localStorage.setItem('adventures_index', JSON.stringify(arr));
    }

    // ── Azioni ─────────────────────────────────────────────────
    function nuovaAvventura() {
      const id = 'adv_' + Date.now();
      const index = caricaIndex();
      index.push({ id, titolo: 'Nuova avventura', autore: '', aggiornatoIl: new Date().toISOString() });
      salvaIndex(index);
      window.location.href = 'editor/index.html?id=' + id;
    }

    function apriAvventura(id) {
      window.location.href = 'editor/index.html?id=' + id;
    }

    function eliminaAvventura(id) {
      if (!confirm('Eliminare questa avventura? L\'operazione non è reversibile.')) return;
      let index = caricaIndex();
      index = index.filter(a => a.id !== id);
      salvaIndex(index);
      localStorage.removeItem('adventure_' + id);
      renderDashboard();
    }

    function caricaEsempio() {
      const id = 'adv_' + Date.now();
      localStorage.setItem('adventure_' + id, JSON.stringify(AVVENTURA_ESEMPIO));
      const index = caricaIndex();
      index.push({
        id,
        titolo: AVVENTURA_ESEMPIO.meta.titolo,
        autore: AVVENTURA_ESEMPIO.meta.autore,
        aggiornatoIl: new Date().toISOString()
      });
      salvaIndex(index);
      window.location.href = 'editor/index.html?id=' + id;
    }

    // ── Render ─────────────────────────────────────────────────
    function formatData(iso) {
      try {
        return new Date(iso).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
      } catch(e) { return ''; }
    }

    function renderDashboard() {
      const index = caricaIndex();
      const container = document.getElementById('dashboard');

      if (index.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-illustration">  [ ADVENTURE CREATOR ]\n\n  +----------+     +----------+\n  |  Stanza  |---->|  Stanza  |\n  |    A     |     |    B     |\n  +----------+     +----------+\n       |                |\n       v                v\n  +----------+     +----------+\n  |  Stanza  |     |  FINE!   |\n  |    C     |     |  Vittoria|\n  +----------+     +----------+</div>
            <h2>Nessuna avventura ancora</h2>
            <p>Crea la tua prima avventura testuale o carica un esempio per iniziare.</p>
            <button class="btn-esempio" onclick="caricaEsempio()">Carica avventura esempio</button>
          </div>`;
        return;
      }

      let html = `<p class="section-title">Le tue avventure</p><div class="cards-grid">`;

      index.forEach(adv => {
        html += `
          <div class="card">
            <div class="card-title">${adv.titolo || 'Senza titolo'}</div>
            <div class="card-meta">${adv.autore ? adv.autore + ' &mdash; ' : ''}Modificata il ${formatData(adv.aggiornatoIl)}</div>
            <div class="card-actions">
              <button class="btn-apri" onclick="apriAvventura('${adv.id}')">Apri</button>
              <button class="btn-elimina" onclick="eliminaAvventura('${adv.id}')" title="Elimina avventura">&#128465;</button>
            </div>
          </div>`;
      });

      // Card esempio sempre in fondo
      html += `
        <div class="card card-esempio">
          <div class="card-title">Il Cammino del Cavaliere</div>
          <div class="card-meta">Avventura esempio — Medioevo 1200</div>
          <div class="card-actions">
            <button class="btn-apri" onclick="caricaEsempio()">Carica</button>
          </div>
        </div>`;

      html += `</div>`;
      container.innerHTML = html;
    }

    // ── Init ───────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', renderDashboard);
  </script>

</body>
</html>
