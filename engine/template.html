<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITOLO__</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #33ff33;
      --ambra: #ffb000;
      --sfondo: #0a0a0a;
      --testo: #33ff33;
    }

    body {
      background: var(--sfondo);
      color: var(--testo);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    #gioco {
      width: 100%;
      max-width: 800px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    #titolo {
      text-align: center;
      font-size: 28px;
      color: var(--ambra);
      padding: 12px 0 8px;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
      text-transform: uppercase;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 4px;
      line-height: 1.6;
    }

    #output::-webkit-scrollbar { width: 4px; }
    #output::-webkit-scrollbar-thumb { background: #333; }

    .riga-output {
      margin-bottom: 6px;
      white-space: pre-wrap;
    }

    .riga-output strong {
      color: var(--ambra);
    }

    .riga-input {
      color: #666;
      margin: 4px 0;
    }

    #form-input {
      display: flex;
      border-top: 1px solid #333;
      padding-top: 12px;
      gap: 8px;
      align-items: center;
    }

    #prompt {
      color: var(--ambra);
      font-size: 22px;
      flex-shrink: 0;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--testo);
      font-family: 'VT323', 'Courier New', monospace;
      font-size: 20px;
      outline: none;
      caret-color: var(--ambra);
    }

    #input::placeholder { color: #333; }

    .schermata-fine {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      border: 1px solid;
      line-height: 1.8;
    }

    .schermata-fine.vittoria {
      border-color: var(--ambra);
      color: var(--ambra);
      font-size: 24px;
    }

    .schermata-fine.sconfitta {
      border-color: #ff3333;
      color: #ff3333;
      font-size: 22px;
    }

    .schermata-fine button {
      margin-top: 16px;
      background: transparent;
      border: 1px solid currentColor;
      color: inherit;
      font-family: inherit;
      font-size: 18px;
      padding: 8px 24px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .schermata-fine button:hover { background: rgba(255,255,255,.1); }

    /* Cursore lampeggiante su input */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    #prompt { animation: blink 1s step-end infinite; }
  </style>
</head>
<body>
  <div id="gioco">
    <div id="titolo">__TITOLO__</div>
    <div id="output"></div>
    <form id="form-input" autocomplete="off">
      <span id="prompt">&gt;</span>
      <input type="text" id="input" placeholder="scrivi un comando..." autofocus>
    </form>
  </div>

  <script>
    const __ADVENTURE_DATA__ = /*__ADVENTURE_JSON__*/null;
    /*__ENGINE_JS__*/
    window.addEventListener('DOMContentLoaded', () => {
      // Sostituisci titolo nella pagina
      const titolo = __ADVENTURE_DATA__?.meta?.titolo || 'Avventura';
      document.title = titolo;
      document.querySelectorAll('#titolo').forEach(el => el.textContent = titolo);
      avviaGioco(__ADVENTURE_DATA__);
    });
  </script>
</body>
</html>
